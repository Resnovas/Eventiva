# Repository-owned under sync.exclude in .github/smartcloud.yml (EVE-265).
# Jonathan approved all-case, all-depth examples/externals exclusions, 2026-11-18.
# exclude-paths affects VERSION UPDATES ONLY, not dependency graph or alerts.
# Keep the house weekly schedule, cooldown and separate security-update groups.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - '**/[eE][xX][aA][mM][pP][lL][eE][sS]/**'
      - '**/[eE][xX][tT][eE][rR][nN][aA][lL][sS]/**'
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    cooldown:
      default-days: 7
    # v6.1.1's native pnpm 11.28.10 bootstrap intermittently installs one of
    # its two packages, so setup-node's `pnpm store path` fails (PR #1046
    # smoke, 2026-11-18). Skip only that release; later fixes still arrive.
    ignore:
      - dependency-name: pnpm/action-setup
        versions: ['6.1.1']
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - '**/[eE][xX][aA][mM][pP][lL][eE][sS]/**'
      - '**/[eE][xX][tT][eE][rR][nN][aA][lL][sS]/**'
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    cooldown:
      default-days: 7
    versioning-strategy: increase
    # Expo SDK 56 pins react/react-dom 19.2.3 and react-native 0.85.3 in its
    # bundledNativeModules.json, and react-native 0.85.3's renderer throws
    # unless React.version is exactly 19.2.3, so even a React patch breaks the
    # app. Move these three only in a coherent Expo SDK migration (#1045,
    # #1050, #1051); @types/react still takes patches.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
