# Repository-owned EVE-265 override, excluded from house sync in smartcloud.yml.
# Derived from Resnovas/.github's reusable scorecard.yml; retain its events,
# permissions and SARIF category when maintaining this local scanner pin.
# v2.5.0 reads both PNPM YAML documents; v2.4.4 missed application packages.
# OSV honors the root .gitignore reference-directory policy in its remote archive.
name: House Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  house-scorecard:
    name: house-scorecard / scorecard
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The previous reusable run reported publication disabled. Do not
          # activate external publication by moving this job into the caller.
          publish_results: false

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
