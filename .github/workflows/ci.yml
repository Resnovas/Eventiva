# Application checks for the EVE-244 foundation, as parallel jobs: verify runs
# the Nx lint, typecheck, test and build targets, and smoke runs the server
# start, the i18n catalogue check, the Android Hermes export and the
# Playwright web smoke. The application check job waits for both and is the
# one context the ruleset requires (.github/smartcloud.yml), so adding a job
# never touches the ruleset. Nx runs locally only: no Nx Cloud, no EAS, no
# deployment and no PostHog ingestion.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Each job asks for the access it needs; the workflow grants none.
permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Forward-only migration policy against trusted history
        env:
          STORAGE_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: node tools/storage/policy.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Candidate HEAD cannot certify its own new-code documentation debt.
      # A manual event without earlier trusted history fails rather than resetting the ledger.
      - name: Documentation against trusted history
        env:
          DOCUMENTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node --run documentation

      # Nx replays a task only when its input hash matches; a pull request's
      # entries stay on its own ref, so they never reach main.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-verify
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Project references are in sync
        run: pnpm nx sync:check

      # Process conformance imports the actual emitted server, not source aliases.
      - name: Build declared outputs before resolving the complete graph
        run: pnpm nx run-many -t build --parallel=1 --outputStyle=static

      - name: Source, type-only and declared package boundaries
        run: |
          node tools/resources/boundaries.mjs
          node --test tools/resources/boundaries.test.mjs tools/resources/types.test.mjs

      # Standing owner acceptance (2026-11-18, EVE-42) is synthetic-fixture-only.
      # Compare Bookworm/Alpine scans routinely; prefer fewer findings after
      # compatibility checks. No calendar gate; untrusted PR code stays denied.
      - name: Start bounded disposable PostgreSQL fixture
        env:
          TRUSTED_FIXTURE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}
        run: |
          test "$TRUSTED_FIXTURE" = true
          bootstrap=$(openssl rand -hex 32)
          STORAGE_FIXTURE_PASSWORD=$(openssl rand -hex 32)
          export STORAGE_FIXTURE_PASSWORD
          echo "::add-mask::$bootstrap"
          echo "::add-mask::$STORAGE_FIXTURE_PASSWORD"
          export POSTGRES_PASSWORD="$bootstrap"
          docker network create eventiva-storage-test
          docker run --detach --rm --name eventiva-storage-test \
            --network eventiva-storage-test --publish 127.0.0.1:5432:5432 \
            --cpus 2 --memory 1g --pids-limit 256 --security-opt no-new-privileges \
            --tmpfs /var/lib/postgresql/data:rw,size=256m \
            --env POSTGRES_DB=eventiva_test --env POSTGRES_PASSWORD \
            --env 'POSTGRES_INITDB_ARGS=--auth-local=scram-sha-256 --auth-host=scram-sha-256' \
            docker.io/library/postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
          export PGPASSWORD="$bootstrap"
          for _ in {1..30}; do
            if docker exec --env PGPASSWORD eventiva-storage-test \
              psql -h 127.0.0.1 -U postgres -d eventiva_test -c 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -i --env PGPASSWORD --env STORAGE_FIXTURE_PASSWORD eventiva-storage-test \
            psql -h 127.0.0.1 -U postgres -d eventiva_test -v ON_ERROR_STOP=1 <<'SQL'
          \getenv fixture_password STORAGE_FIXTURE_PASSWORD
          CREATE ROLE eventiva_fixture LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'fixture_password';
          ALTER DATABASE eventiva_test OWNER TO eventiva_fixture;
          SQL
          echo "STORAGE_TEST_POSTGRES_URL=postgres://eventiva_fixture:$STORAGE_FIXTURE_PASSWORD@127.0.0.1:5432/eventiva_test" >> "$GITHUB_ENV"

      - name: Lint, typecheck, test, build and action parity
        run: pnpm nx run-many -t lint typecheck test build parity --parallel=1 --outputStyle=static

      - name: Public declaration type boundaries
        run: node tools/resources/boundaries.mjs --declarations

      - name: Remove disposable PostgreSQL fixture
        if: always()
        run: |
          if docker container inspect eventiva-storage-test >/dev/null 2>&1; then docker stop eventiva-storage-test; fi
          if docker network inspect eventiva-storage-test >/dev/null 2>&1; then docker network rm eventiva-storage-test; fi

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke
        run: pnpm nx run-many -t smoke --parallel=1 --outputStyle=static --skip-nx-cache

  # The required context. It runs even when a job above fails or is cancelled,
  # and passes only when every job succeeded.
  application-check:
    name: application check
    needs: [verify, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then echo "::error::Not every CI job passed:"; echo "$failed"; exit 1; fi
