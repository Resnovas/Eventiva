name: Eventiva active repository
paths-ignore:
    # EVE-242 preserves these as evidence, not active source to build or scan.
    - Examples/**
    # Pinned upstream implementations are reference data, not Eventiva source.
    - externals/**
    # Generated mirrors of the agent sources are not application source.
    - .claude/skills/**
    - .claude/commands/**
    - .cursor/commands/**
