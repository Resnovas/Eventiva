<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="28" viewBox="0 0 1280 28" role="img" aria-label="Divider">
<title>Divider</title>
<style>
text{font-family:Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.spark{animation:travel 6s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0)}50%{transform:translateX(1180px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#866af8" stop-opacity="0"/><stop offset=".15" stop-color="#866af8"/><stop offset=".35" stop-color="#57cdf7"/><stop offset=".5" stop-color="#f6cc02"/><stop offset=".65" stop-color="#04cbaf"/><stop offset=".85" stop-color="#fa4669"/><stop offset="1" stop-color="#fa4669" stop-opacity="0"/></linearGradient>
<radialGradient id="s"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="12.5" width="1280" height="3" rx="1.5" fill="url(#g)"/>
<g class="spark"><circle cx="50" cy="14" r="12" fill="url(#s)"/></g>
</svg>
